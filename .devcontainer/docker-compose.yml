version: '3'

services:
  autotablature:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace
      - autotablature-data:/workspace/data
      - autotablature-models:/workspace/models
    command: sleep infinity
    environment:
      - PYTHONPATH=/workspace
    ports:
      - "8888:8888"
    # Uncomment the following lines if you have NVIDIA GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [gpu]

volumes:
  autotablature-data:
  autotablature-models:
