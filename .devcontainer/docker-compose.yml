version: '3'

services:
  autotablature:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace
      - autotablature-data:/workspace/data
      - autotablature-models:/workspace/models
    command: sleep infinity
    environment:
      - PYTHONPATH=/workspace
    ports:
      - "8888:8888"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

volumes:
  autotablature-data:
  autotablature-models:
